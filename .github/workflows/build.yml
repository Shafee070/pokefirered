name: Build Pokemon FireRed Hyderabad Edition

on:
  push:
  workflow_dispatch:

jobs:
  build-hyderabad-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GBA Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi git libpng-dev python3
          git clone --depth 1 https://github.com/pret/agbcc.git /tmp/agbcc
          cd /tmp/agbcc
          ./build.sh
          ./install.sh $GITHUB_WORKSPACE

      - name: Inject Hyderabad Text & Fix Region Map C Code
        run: |
          python3 - << 'EOF'
          import os

          # 1. FIX REGION MAP C STRINGS DIRECTLY IN src/region_map.c
          rmap_path = "src/region_map.c"
          if os.path.exists(rmap_path):
              with open(rmap_path, "r", encoding="utf-8") as f:
                  code = f.read()
              
              # Replace dungeon and town C string arrays safely
              code = code.replace('sMapsecName_VIRIDIAN_FOREST', 'sMapsecName_KBR_PARK')
              code = code.replace('sMapsecName_MT__MOON', 'sMapsecName_BANJARA_HILLS')
              code = code.replace('sMapsecName_SAFARI_ZONE', 'sMapsecName_LION_SAFARI')
              code = code.replace('sMapsecName_ROCK_TUNNEL', 'sMapsecName_JUBILEE_TUNNEL')
              code = code.replace('sMapsecName_POWER_PLANT', 'sMapsecName_BHEL_PLANT')
              code = code.replace('sMapsecName_PALLET_TOWN', 'sMapsecName_SECUNDERABAD')
              code = code.replace('sMapsecName_VIRIDIAN_CITY', 'sMapsecName_KHAIRATABAD')
              code = code.replace('sMapsecName_PEWTER_CITY', 'sMapsecName_GOLCONDA_FORT')

              with open(rmap_path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("[+] Patched src/region_map.c successfully")

          # 2. PATCH HYDERABADI ITEMS SAFELY
          item_swaps = {
              "POTION": "NIMBU PANI",
              "SUPER POTION": "BADAM MILK",
              "HYPER POTION": "MUTTON MARAG",
              "MAX POTION": "SHAHI HALEEM",
              "FULL RESTORE": "KACCHI DUM",
              "REVIVE": "KADAK CHAI",
              "FRESH WATER": "IRANI CHAI",
              "SODA POP": "GOLI SODA",
              "LEMONADE": "QUBANI SWEET",
              "MOOMOO MILK": "DUM BIRYANI",
              "LAVA COOKIE": "OSMANIA BISC",
              "TOWN MAP": "HYD CITY MAP",
              "BICYCLE": "ACTIVA 6G",
          }
          for h_path in ["src/data/items.h", "src/data/text/item_names.h"]:
              if os.path.exists(h_path):
                  with open(h_path, "r", encoding="utf-8") as f:
                      txt = f.read()
                  for old, new in item_swaps.items():
                      txt = txt.replace(f'_("{old}")', f'_("{new}")')
                  with open(h_path, "w", encoding="utf-8") as f:
                      f.write(txt)

          # 3. LINE-BY-LINE DIALOGUE PATCHER
          def patch_labels(filepath, label_dict):
              if not os.path.exists(filepath):
                  return
              with open(filepath, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              out = []
              i = 0
              while i < len(lines):
                  stripped = lines[i].strip()
                  matched = None
                  for label in label_dict:
                      if stripped in (label + ":", label + "::"):
                          matched = label
                          break
                  if matched:
                      out.append(lines[i])
                      for s in label_dict[matched]:
                          out.append(f'    .string "{s}"\n')
                      i += 1
                      while i < len(lines) and lines[i].strip().startswith(".string"):
                          i += 1
                  else:
                      out.append(lines[i])
                      i += 1
              with open(filepath, "w", encoding="utf-8") as f:
                  f.writelines(out)

          # APPLY DIALOGUE OVERHAUL
          patch_labels("data/text/new_game_intro.inc", {
              "gOakSpeech_Text_WelcomeToTheWorld": [
                  "Assalamu Alaikum aur Namaste miya!\\n",
                  "Hyderabad ke duniya mein khushamdeed!\\p",
                  "Mera naam PROF. OSMANI hai.\\n",
                  "Pura Secunderabad aur Old City\\l",
                  "mereku POKeMON USTAAD bolta.\\p$"
              ],
              "gOakSpeech_Text_ThisWorld": [
                  "Apne sheher mein Charminar se leke\\n",
                  "Gachibowli tak har jagah POKeMON\\l",
                  "bhare hue hain!$"
              ],
              "gOakSpeech_Text_InhabitedFarAndWide": [
                  "Kuch log inlog ku shauk se paalte,\\n",
                  "toh kuch log Barkas ke pehlwano\\l",
                  "ke jaisa muqabla karate.\\p",
                  "Aur apan? Apan Osmania Lab mein\\n",
                  "baithke Irani Chai peete-peete\\l",
                  "inpe research karte.\\p$"
              ],
              "gOakSpeech_Text_TellMeALittleAboutYourself": [
                  "Chalo pehle tumhare baare mein\\n",
                  "batao zara.\\p",
                  "Tum patthe ho ya patthi?\\n",
                  "Bolo miya?$"
              ],
              "gOakSpeech_Text_YourNameWhatIsIt": [
                  "Pehle yeh batao, tumhara\\n",
                  "shubh naam kya hai pasha?$"
              ],
              "gOakSpeech_Text_SoYourNameIsPlayer": [
                  "Hau! Toh tumhara naam\\n",
                  "{PLAYER} hai na? Kirrak naam hai!$"
              ],
              "gOakSpeech_Text_WhatWasHisName": [
                  "Yeh mera pota hai.\\n",
                  "Bachpan se tumhara sabse bada\\l",
                  "rival aur ek number ka pheku hai.\\p",
                  "...Arre baigan, iska naam\\n",
                  "bhool gaya main! Kya tha bolo?$"
              ],
              "gOakSpeech_Text_RememberRivalsName": [
                  "{PLAYER}!\\p",
                  "Ab tumhara asli Hyderabadi\\n",
                  "POKeMON dastan shuru hone wala hai!\\p",
                  "Biryani khao, Chai piyo, aur\\n",
                  "Falaknuma Palace ke Champion bano!\\l",
                  "Chalo nikalte!$"
              ]
          })

          patch_labels("data/maps/PalletTown/text.inc", {
              "PalletTown_Text_OakDontGoOut": [
                  "PROF. OSMANI: Arre theruko miya!\\n",
                  "Udhar mat jao! Rukho!$"
              ],
              "PalletTown_Text_OakGrassUnsafeNeedMon": [
                  "PROF. OSMANI: Dimaag kharab hai kya?\\n",
                  "Tank Bund ke ghaas mein jangli\\l",
                  "POKeMON ghoomre! Baigan mein\\l",
                  "mil jaate tum!\\p",
                  "Mere saath aao, Osmania Lab mein\\n",
                  "tumaku ek kirrak POKeMON detaun!$"
              ],
              "PalletTown_Text_RaisingMonsToo": [
                  "Kya miya, kidhar nikalre?\\n",
                  "Main bhi POKeMON paalru malum!\\p",
                  "Ek baar inlog pehlwan ban gaye na,\\n",
                  "Old City se HITEC City tak\\l",
                  "kisi ke baap se nahi dartaun!$"
              ],
              "PalletTown_Text_TownSign": [
                  "SECUNDERABAD\\n",
                  "Jahan se har asli ustaad ka\\l",
                  "safar shuru hota!$"
              ],
              "PalletTown_Text_OakPokemonResearchLab": [
                  "OSMANIA POKeMON RESEARCH LAB\\n",
                  "Chai peete, Research karte!$"
              ]
          })

          patch_labels("data/maps/PalletTown_ProfessorOaksLab/text.inc", {
              "PalletTown_ProfessorOaksLab_Text_OakChooseOneMon": [
                  "PROF. OSMANI: Sabar karo {RIVAL}!\\n",
                  "Kaaiku itna uchalre?\\p",
                  "Dekho {PLAYER}, table pe teen\\n",
                  "POKe BALLS rakhe hue hain.\\p",
                  "Ab mere paas bas yeh teen bache\\n",
                  "hain. Tum ek chun lo ismein se!$"
              ],
              "PalletTown_ProfessorOaksLab_Text_RivalMyMonLooksTougher": [
                  "{RIVAL}: Rukho {PLAYER}!\\n",
                  "Aiseich nikal jaare kya?\\p",
                  "Chalo abhi ke abhi ek muqabla\\n",
                  "ho jaye! Dekhte kiska POKeMON\\l",
                  "asli pehlwan hai! Aao maidan mein!$"
              ],
              "PalletTown_ProfessorOaksLab_Text_RivalDefeat": [
                  "AYYO BAIGAN!\\n",
                  "Yeh kaise ho gaya?!\\l",
                  "Galat POKeMON utha liya kya main?!$"
              ],
              "PalletTown_ProfessorOaksLab_Text_RivalGoToughenMyMon": [
                  "{RIVAL}: Jaando miya! Badluck tha,\\n",
                  "warna tumaku dikha deta tha!\\p",
                  "Abhi main Tank Bund pe jaake apne\\n",
                  "POKeMON ko kadak banataun.\\p",
                  "Chaltaun {PLAYER}! Dada, salam!$"
              ]
          })

          patch_labels("data/maps/Route1/text.inc", {
              "Route1_Text_RouteSign": [
                  "TANK BUND ROAD\\n",
                  "SECUNDERABAD - KHAIRATABAD$"
              ]
          })

          patch_labels("data/maps/ViridianCity/text.inc", {
              "ViridianCity_Text_GrandpaHasntHadCoffeeYet": [
                  "UNCLE: Arre baigan! Subah se\\n",
                  "Irani Chai nahi mili mereku!\\l",
                  "Sar phatra mera! Aage nakko jao!\\p",
                  "BAJI: Maaf karo bhaiya, Dada ko\\n",
                  "jab tak subah ki Irani Chai aur\\l",
                  "Osmania Biscuit nahi milti, ino\\l",
                  "rasta roke baith jaate!$"
              ],
              "ViridianCity_Text_CitySign": [
                  "KHAIRATABAD CHAURHA\\n",
                  "Shaan-e-Hyderabad$"
              ]
          })
          print("[*] Successfully injected all Hyderabad mods.")
          EOF

      - name: Build Tools First
        run: make tools -j$(nproc)

      - name: Compile Only FireRed GBA ROM
        run: |
          sed -i 's/sha1sum -c/true #/g' Makefile
          make firered -j$(nproc) COMPARE=0 compare=0

      - name: Upload Playable GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-FireRed-Hyderabad-Edition
          path: pokefirered.gba
          
